<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Download speed</title>
<style>
  body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: #0e0e15; color: #f2f2f5; }
  .wrap { padding: 14px 18px; }
  .speed { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .sub { font-size: 13px; color: #c3c3d1; margin-top: 2px; }
  .close { position: absolute; top: 6px; right: 10px; background: none; border: none; color: #8b8b9e; font-size: 16px; cursor: pointer; }
</style>
</head>
<body>
<button class="close" id="widget-close" title="Close speed monitor">✕</button>
<div class="wrap">
  <div class="speed" id="widget-speed">0 B/s</div>
  <div class="sub" id="widget-sub">No active downloads</div>
</div>
<script src="widget.js"></script>
</body>
</html>
